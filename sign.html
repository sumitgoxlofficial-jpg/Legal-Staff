<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign a document · Legal Staff</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<link rel="icon" href="assets/ls-favicon.png">
<style>
@font-face{font-family:"Pinyon Script";src:url(assets/fonts/pinyon-script-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Great Vibes";src:url(assets/fonts/great-vibes-latin-400-normal.woff2) format("woff2");font-display:swap}
:root{--ink:#0A0A0A;--mut:#5E5E5E;--line:#E5E5E5;--soft:#F5F5F4;--red:#B42318;--redbg:#FDECEA;--green:#137333;--greenbg:#E7F6EC;--blue:#1D4ED8}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#FAFAF9;color:var(--ink);font:15px/1.55 "Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
header.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
header.top img{height:22px;display:block}
header.top b{font-weight:600;letter-spacing:-.01em}
header.top span{margin-left:auto;font-size:12.5px;color:var(--mut)}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}
.narrow{max-width:460px;margin:24px auto}
h1{font-size:21px;line-height:1.3;letter-spacing:-.02em;margin:0 0 6px;font-weight:600}
h2{font-size:15px;margin:0 0 8px;font-weight:600}
p{margin:0 0 12px}
.mut{color:var(--mut);font-size:13.5px}
.btn{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:0 18px;min-height:44px;cursor:pointer}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.danger{color:var(--red);border-color:#F4B8B1}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
input[type=text],input[type=email],input[type=tel],textarea,select{font:inherit;width:100%;min-height:44px;border:1px solid #CFCFCB;border-radius:8px;padding:8px 12px;background:#fff;color:var(--ink)}
textarea{min-height:90px}
label.f{display:block;font-size:13px;color:var(--mut);margin:0 0 12px}
label.f>*:not(span){margin-top:4px}
.code{letter-spacing:.5em;font-size:22px;text-align:center;font-variant-numeric:tabular-nums}
.note{font-size:12.5px;line-height:1.55;background:#F7F7F5;border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:#363636}
.err{background:var(--redbg);border:1px solid #F4B8B1;color:var(--red);border-radius:8px;padding:9px 12px;font-size:13.5px;margin:0 0 12px}
.ok{background:var(--greenbg);color:var(--green);border-radius:8px;padding:10px 12px;margin:0 0 12px}
.check{width:60px;height:60px;border-radius:30px;background:var(--greenbg);color:var(--green);font-size:32px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.pages{display:flex;flex-direction:column;gap:14px;min-width:0}
.page{position:relative;width:100%;background:#fff;border:1px solid var(--line);border-radius:4px;box-shadow:0 1px 6px rgba(0,0,0,.06);overflow:hidden;user-select:none}
.page .ln{position:absolute;white-space:pre;font-family:"Times New Roman",Times,serif;color:#1A1A1A;line-height:1.2;pointer-events:none}
.page .rule{position:absolute;background:#0A0A0A;pointer-events:none}
.page .pn{position:absolute;left:0;right:0;text-align:center;color:#8A8A8A;pointer-events:none}
.fld{position:absolute;border-radius:4px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:11px;font-weight:600;text-align:center;line-height:1.1}
.fld.mine{border:2px solid var(--blue);background:rgba(29,78,216,.10);color:var(--blue);cursor:pointer;animation:pulse 2s infinite}
.fld.mine.done{animation:none;border-style:solid;background:rgba(19,115,51,.08);border-color:var(--green);color:var(--ink)}
.fld.other{border:1.5px dashed #9A9A96;background:rgba(0,0,0,.04);color:#6B6B6B}
.fld img{max-width:100%;max-height:100%;object-fit:contain}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(29,78,216,.18)}}
@media (prefers-reduced-motion:reduce){.fld.mine{animation:none}}
.panel{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;font-weight:600;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
canvas.pad{width:100%;height:150px;border:1px dashed #9A9A96;border-radius:8px;background:#fff;touch-action:none;display:block}
.fonts{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.fonts button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;min-height:40px;cursor:pointer;font-size:19px}
.fonts button[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 2px rgba(0,0,0,.12)}
.preview{border:1px solid var(--line);border-radius:8px;min-height:70px;display:flex;align-items:center;justify-content:center;background:#fff;padding:6px}
.preview img{max-width:100%;max-height:90px}
.bar{display:none}
.row{display:flex;gap:10px;flex-wrap:wrap}
details summary{cursor:pointer;color:var(--mut);font-size:13.5px}
.small{font-size:12px;color:var(--mut)}
@media (max-width:820px){
 .layout{grid-template-columns:1fr}
 .panel{position:static}
 main{padding:12px 10px 110px}
 .bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));gap:10px;align-items:center}
 .bar .btn{flex:1}
 .bar .t{font-size:12.5px;color:var(--mut);flex:1.2;line-height:1.3}
}
</style>
</head>
<body>
