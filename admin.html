<style>
  :root { --bg:#F4F4F2; --card:#FFFFFF; --ink:#0A0A0A; --txt:#363636; --mut:#6B6B6B; --line:#E5E5E5; --soft:#F5F5F4; --rev:#2a78d6; --exp:#eb6834;
    --good:#137333; --goodbg:#E7F6EC; --warn:#B54708; --warnbg:#FEF3E2; --bad:#B42318; --badbg:#FDECEA; --info:#1D4ED8; --infobg:#E8EEFD; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 'Instrument Sans',system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased; }
  button, input, select, textarea { font:inherit; color:inherit; }
  .btn { height:34px; padding:0 14px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; font-weight:500; white-space:nowrap; }
  .btn:hover { border-color:#BDBDBD; } .btn.pri { background:var(--ink); color:#fff; border-color:var(--ink); } .btn.pri:hover { background:#262626; }
  .btn.sm { height:28px; padding:0 10px; font-size:12.5px; } .btn.danger { color:var(--bad); } .btn:disabled { opacity:.5; cursor:default; }
  input, select, textarea { height:36px; border:1px solid var(--line); border-radius:8px; padding:0 10px; background:#fff; width:100%; }
  textarea { height:auto; padding:10px; resize:vertical; line-height:1.5; }
  input:focus, select:focus, textarea:focus { outline:2px solid #0A0A0A22; border-color:#9A9A9A; }
  label.f { display:flex; flex-direction:column; gap:5px; font-size:12.5px; color:var(--mut); font-weight:500; }
  .wrap { max-width:1240px; margin:0 auto; padding:0 20px; }
  header.top { background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header.top .wrap { display:flex; align-items:center; gap:18px; height:60px; }
  .brand { display:flex; align-items:center; gap:9px; font-weight:700; font-size:16px; letter-spacing:-.02em; white-space:nowrap; }
  .brand img { width:24px; height:25px; } .brand small { font-weight:600; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:#fff; background:var(--ink); padding:2px 7px; border-radius:5px; }
  nav.tabs { display:flex; gap:2px; overflow-x:auto; flex:1; scrollbar-width:none; } nav.tabs::-webkit-scrollbar { display:none; }
  nav.tabs button { border:0; background:none; padding:8px 12px; border-radius:8px; cursor:pointer; color:var(--mut); font-weight:500; white-space:nowrap; position:relative; }
  nav.tabs button:hover { color:var(--ink); background:var(--soft); } nav.tabs button.on { color:var(--ink); background:var(--soft); font-weight:600; }
  nav.tabs .badge { margin-left:6px; background:var(--bad); color:#fff; border-radius:999px; padding:0 6px; font-size:11px; font-weight:600; }
  .who { font-size:12.5px; color:var(--mut); white-space:nowrap; display:flex; gap:10px; align-items:center; }
  main { padding:26px 0 60px; }
  h1 { font-size:22px; letter-spacing:-.02em; margin:0 0 4px; } .sub { color:var(--mut); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
  .grid { display:grid; gap:14px; } .k4 { grid-template-columns:repeat(4,minmax(0,1fr)); } @media (max-width:980px) { .k4 { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .kpi .k { font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--mut); font-weight:600; }
  .kpi .v { font-size:26px; font-weight:700; letter-spacing:-.02em; margin-top:6px; font-variant-numeric:tabular-nums; } .kpi .s { font-size:12.5px; color:var(--mut); margin-top:2px; }
  .kpi .v.neg { color:var(--bad); }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; } .between { justify-content:space-between; } .grow { flex:1; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; } th { text-align:left; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--mut); font-weight:600; padding:10px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:11px 10px; border-bottom:1px solid #EFEFEE; vertical-align:middle; } tr:last-child td { border-bottom:0; } td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  tbody tr:hover { background:#FAFAF9; } .tscroll { overflow-x:auto; margin:0 -20px; padding:0 20px; }
  .chip { display:inline-block; font-size:11.5px; font-weight:600; padding:2px 9px; border-radius:999px; white-space:nowrap; }
  .c-good { color:var(--good); background:var(--goodbg); } .c-warn { color:var(--warn); background:var(--warnbg); } .c-bad { color:var(--bad); background:var(--badbg); } .c-info { color:var(--info); background:var(--infobg); } .c-mut { color:var(--mut); background:var(--soft); }
  .muted { color:var(--mut); } .small { font-size:12.5px; } .strong { font-weight:600; } .mono { font-variant-numeric:tabular-nums; }
  .empty { padding:30px; text-align:center; color:var(--mut); }
  .seg { display:inline-flex; background:var(--soft); border-radius:8px; padding:3px; gap:2px; } .seg button { border:0; background:none; padding:5px 11px; border-radius:6px; cursor:pointer; color:var(--mut); font-weight:500; font-size:13px; } .seg button.on { background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .chart { position:relative; } .chart svg { display:block; width:100%; height:auto; overflow:visible; }
  .legend { display:flex; gap:16px; font-size:12.5px; color:var(--txt); } .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  .tip { position:absolute; pointer-events:none; background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 6px 20px rgba(0,0,0,.1); padding:8px 11px; font-size:12.5px; white-space:nowrap; transform:translate(-50%,-100%); display:none; z-index:2; }
  .tip b { display:block; margin-bottom:3px; }
  .modal-bg { position:fixed; inset:0; background:rgba(20,20,20,.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:20; }
  .modal { background:#fff; border-radius:14px; width:100%; max-width:520px; max-height:92vh; overflow:auto; padding:24px; display:flex; flex-direction:column; gap:14px; box-shadow:0 24px 64px rgba(0,0,0,.2); }
  .modal h2 { margin:0; font-size:17px; } .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 16px; border-radius:10px; font-size:13.5px; z-index:30; box-shadow:0 10px 30px rgba(0,0,0,.25); }
  .err { color:var(--bad); font-size:13px; }
  .split { display:grid; grid-template-columns:minmax(260px,360px) 1fr; gap:14px; align-items:start; }
  .msg-item { padding:12px 14px; border-bottom:1px solid #EFEFEE; cursor:pointer; } .msg-item:hover { background:#FAFAF9; } .msg-item.on { background:var(--soft); }
  .login { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .login .card { width:100%; max-width:380px; padding:28px; display:flex; flex-direction:column; gap:14px; }
  .bar-fill { height:6px; border-radius:3px; background:var(--soft); overflow:hidden; } .bar-fill > div { height:100%; background:var(--ink); border-radius:3px; }
  @media (max-width: 760px) { .split { grid-template-columns:1fr; } .two { grid-template-columns:1fr; } .who span { display:none; } header.top .wrap { gap:10px; } .kpi .v { font-size:22px; } }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
<style id="theme">
  /* ===== Legal Staff admin: design layer (sidebar layout, consistent components, gentle motion) ===== */
  :root { --bg:#F5F5F3; --side:#0C0C0D; --side2:#161617; --side-line:#232325; --side-txt:#A8A8AD; --side-hi:#FFFFFF; --accent:#2a78d6; --accent-soft:#E8F0FB; --radius:12px; --sh1:0 1px 2px rgba(10,10,10,.04); --sh2:0 6px 20px rgba(10,10,10,.08); --ease:cubic-bezier(.2,.7,.2,1); --sidew:252px; }
  html { scroll-behavior:smooth; }
  body { background:var(--bg); letter-spacing:-.003em; }
  ::selection { background:#0A0A0A; color:#fff; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  /* layout */
  .app { display:grid; grid-template-columns:var(--sidew) minmax(0,1fr); min-height:100vh; }
  .side { background:var(--side); color:var(--side-txt); position:sticky; top:0; height:100vh; display:flex; flex-direction:column; z-index:40; border-right:1px solid var(--side-line); }
  .side .brand { color:var(--side-hi); padding:20px 20px 16px; font-size:16px; }
  .side .brand img { width:28px; height:29px; filter:invert(1); }
  .side .brand small { background:#fff; color:#0A0A0A; }
  .nav { flex:1; overflow-y:auto; padding:4px 12px 16px; scrollbar-width:thin; scrollbar-color:#2a2a2d transparent; }
  .nav-label { font-size:10.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:#6E6E74; padding:16px 10px 6px; }
  .nav-item { display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:9px; color:var(--side-txt); text-decoration:none; font-weight:500; font-size:14px; position:relative; transition:background .18s var(--ease), color .18s var(--ease); cursor:pointer; }
  .nav-item svg { width:18px; height:18px; flex:none; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; opacity:.9; }
  .nav-item:hover { background:var(--side2); color:var(--side-hi); }
  .nav-item.on { background:#fff; color:#0A0A0A; font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.3); }
  .nav-item .chev { margin-left:auto; width:15px; height:15px; transition:transform .25s var(--ease); opacity:.6; }
  .nav-item.open .chev { transform:rotate(90deg); }
  .nav-badge { margin-left:auto; background:#E5484D; color:#fff; border-radius:999px; padding:0 7px; font-size:11px; font-weight:700; line-height:18px; min-width:18px; text-align:center; }
  .nav-item .chev + .nav-badge, .nav-item .nav-badge ~ .chev { margin-left:8px; }
  .nav-sub { display:grid; grid-template-rows:0fr; transition:grid-template-rows .3s var(--ease); }
  .nav-sub.open { grid-template-rows:1fr; }
  .nav-sub > div { overflow:hidden; margin-left:19px; padding-left:10px; border-left:1px solid var(--side-line); }
  .nav-sub .sl { font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:#5F5F65; padding:10px 8px 4px; }
  .nav-sub a { display:block; padding:7px 10px; margin:1px 0; border-radius:7px; color:var(--side-txt); text-decoration:none; font-size:13.5px; transition:background .15s, color .15s; }
  .nav-sub a:hover { color:var(--side-hi); background:var(--side2); }
  .nav-sub a.on { color:#fff; background:#26262a; font-weight:600; box-shadow:inset 2px 0 0 #fff; }
  .side-foot { border-top:1px solid var(--side-line); padding:14px; display:flex; align-items:center; gap:10px; }
  .avatar { width:34px; height:34px; border-radius:50%; background:#26262a; color:#fff; display:grid; place-items:center; font-weight:700; font-size:14px; flex:none; }
  .who2 { min-width:0; flex:1; } .who2 b { display:block; color:#fff; font-size:13px; font-weight:600; } .who2 span { display:block; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--side-txt); }
  .side-foot .btn { background:transparent; border-color:#2f2f33; color:#d4d4d8; height:30px; padding:0 10px; font-size:12.5px; }
  .side-foot .btn:hover { background:#1d1d20; border-color:#44444a; color:#fff; }

  .content { min-width:0; display:flex; flex-direction:column; }
  .topbar { height:60px; display:flex; align-items:center; gap:14px; padding:0 28px; background:rgba(245,245,243,.85); backdrop-filter:saturate(1.4) blur(10px); position:sticky; top:0; z-index:20; border-bottom:1px solid var(--line); }
  .crumb { font-size:14px; color:var(--mut); display:flex; align-items:center; gap:8px; min-width:0; white-space:nowrap; overflow:hidden; }
  .crumb b { color:var(--ink); font-weight:600; } .crumb i { font-style:normal; opacity:.5; }
  .topbar .date { margin-left:auto; font-size:12.5px; color:var(--mut); white-space:nowrap; }
  .burger { display:none; width:38px; height:38px; border-radius:9px; border:1px solid var(--line); background:#fff; cursor:pointer; place-items:center; }
  .burger svg { width:18px; height:18px; stroke:#0A0A0A; fill:none; stroke-width:1.9; stroke-linecap:round; }
  .scrim { display:none; }
  main { padding:28px 0 72px; }
  .wrap { max-width:1280px; padding:0 28px; }

  /* page heading */
  h1 { font-size:24px; font-weight:700; letter-spacing:-.025em; margin:0 0 4px; }
  .sub { color:var(--mut); margin:0 0 22px; font-size:14px; max-width:70ch; }
  h2 { letter-spacing:-.015em; }

  /* cards, kpis */
  .card { border-radius:var(--radius); box-shadow:var(--sh1); transition:box-shadow .2s var(--ease), border-color .2s var(--ease), transform .2s var(--ease); }
  .grid > .card.kpi:hover { box-shadow:var(--sh2); border-color:#D8D8D5; transform:translateY(-1px); }
  .kpi { position:relative; overflow:hidden; padding:18px 20px; }
  .kpi::before { content:""; position:absolute; left:0; top:16px; bottom:16px; width:3px; border-radius:0 3px 3px 0; background:var(--accent); opacity:.85; }
  .kpi .k { font-size:11.5px; letter-spacing:.08em; }
  .kpi .v { font-size:28px; margin-top:8px; }
  .kpi .s { font-size:12.5px; margin-top:4px; }

  /* buttons and fields */
  .btn { height:36px; border-radius:9px; font-weight:600; font-size:13.5px; box-shadow:var(--sh1); transition:background .15s, border-color .15s, box-shadow .15s, transform .1s; }
  .btn:hover { border-color:#B5B5B5; background:#FAFAFA; } .btn:active { transform:translateY(1px); }
  .btn.pri { box-shadow:0 1px 2px rgba(10,10,10,.25); } .btn.pri:hover { background:#222; }
  .btn.sm { height:30px; font-size:12.5px; border-radius:8px; } .btn.danger:hover { background:var(--badbg); border-color:#F3C3BE; }
  input, select, textarea { border-radius:9px; transition:border-color .15s, box-shadow .15s; }
  input:hover, select:hover, textarea:hover { border-color:#C9C9C6; }
  input:focus, select:focus, textarea:focus { outline:0; border-color:var(--accent); box-shadow:0 0 0 3px rgba(42,120,214,.15); }
  label.f { font-size:12.5px; font-weight:600; color:#4A4A4A; }

  /* tables */
  .card:has(> .tscroll), .card:has(table) { padding-bottom:12px; }
  th { background:#FAFAF9; border-bottom:1px solid var(--line); font-size:11px; padding:10px 12px; white-space:nowrap; }
  th:first-child { border-radius:8px 0 0 8px; } th:last-child { border-radius:0 8px 8px 0; }
  td { padding:12px; } tbody tr { transition:background .12s; } tbody tr:hover { background:#F8F8F6; }
  .chip { font-size:11.5px; padding:3px 10px; letter-spacing:.005em; }
  .seg { background:#EDEDEA; border-radius:9px; } .seg button { transition:background .15s, color .15s, box-shadow .15s; font-weight:600; font-size:12.5px; }
  .seg button.on { background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.1); }
  .empty { padding:44px 20px; }
  #page a:not(.btn) { color:#1D4ED8; text-underline-offset:2px; } #page a:not(.btn):hover { color:#1E3A8A; }
  .banner { border-radius:10px; }

  /* modal, toast, login */
  .modal-bg { backdrop-filter:blur(3px); animation:fade .2s ease both; } .modal { border-radius:16px; animation:pop .28s var(--ease) both; }
  .toast { animation:toast .3s var(--ease) both; border-radius:10px; }
  .login { background:radial-gradient(1000px 500px at 50% -10%, #E9E9E5, var(--bg)); }
  .login .card { box-shadow:0 20px 60px rgba(10,10,10,.1); padding:32px; border-radius:16px; animation:pop .4s var(--ease) both; }

  /* loading skeleton */
  .skel-block { display:grid; gap:14px; } .skel-block i { display:block; height:96px; border-radius:var(--radius); background:linear-gradient(100deg,#ECECE9 30%,#F6F6F4 50%,#ECECE9 70%); background-size:300% 100%; animation:shimmer 1.3s linear infinite; }
  .skel-block i:first-child { height:34px; width:36%; } .skel-block i:last-child { height:260px; }

  /* motion */
  #page > *, .em-main > * { animation:rise .38s var(--ease) both; }
  #page > :nth-child(2), .em-main > :nth-child(2) { animation-delay:.04s; } #page > :nth-child(3), .em-main > :nth-child(3) { animation-delay:.08s; } #page > :nth-child(n+4), .em-main > :nth-child(n+4) { animation-delay:.12s; }
  .grid.k4 > .card, .grid.k3 > .card, .grid.k6 > .card { animation:rise .45s var(--ease) both; } .grid > .card:nth-child(2) { animation-delay:.05s; } .grid > .card:nth-child(3) { animation-delay:.1s; } .grid > .card:nth-child(4) { animation-delay:.15s; } .grid > .card:nth-child(n+5) { animation-delay:.2s; }
  .chart svg path { transform-box:fill-box; transform-origin:bottom; animation:grow .7s var(--ease) both; }
  .bar-fill > div { transition:width .6s var(--ease); animation:fillbar .8s var(--ease) both; transform-origin:left; }
  @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  @keyframes pop { from { opacity:0; transform:translateY(10px) scale(.98); } to { opacity:1; transform:none; } }
  @keyframes toast { from { opacity:0; transform:translate(-50%,10px); } to { opacity:1; transform:translate(-50%,0); } }
  @keyframes shimmer { to { background-position:-100% 0; } }
  @keyframes grow { from { transform:scaleY(.02); } to { transform:scaleY(1); } }
  @keyframes fillbar { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; scroll-behavior:auto !important; } }

  /* tablet and phone: the sidebar becomes a slide-in drawer */
  @media (max-width:980px) {
    .app { grid-template-columns:minmax(0,1fr); }
    .side { position:fixed; left:0; top:0; bottom:0; width:min(290px,86vw); transform:translateX(-102%); transition:transform .3s var(--ease); box-shadow:none; }
    .side.open { transform:none; box-shadow:0 0 60px rgba(0,0,0,.5); }
    .scrim { display:block; position:fixed; inset:0; background:rgba(10,10,10,.5); z-index:35; opacity:0; pointer-events:none; transition:opacity .25s; }
    .scrim.on { opacity:1; pointer-events:auto; }
    .burger { display:grid; } .topbar { padding:0 16px; } .wrap { padding:0 16px; } main { padding-top:20px; } .topbar .date { display:none; }
  }
  @media (max-width:520px) { .kpi { padding:14px 14px 14px 16px; } .kpi .v { font-size:21px; } .kpi .k { font-size:10.5px; } h1 { font-size:21px; } .card { padding:16px; } .tscroll { margin:0 -16px; padding:0 16px; } }
</style>

<body>
<div id="root"></div>
<script>
(() => {
  const cfg = window.LS_CONFIG || {};
  const root = document.getElementById('root');
  if (!cfg.supabaseUrl || !window.supabase) { root.innerHTML = '<div class="login"><div class="card">The server is not configured.</div></div>'; return; }
  const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);

  // ---------- helpers ----------
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const rs = p => '₹' + (Number(p || 0) / 100).toLocaleString('en-IN', { minimumFractionDigits: p % 100 ? 2 : 0, maximumFractionDigits: 2 });
  const rsShort = p => { const r = Number(p || 0) / 100; return r >= 1e7 ? '₹' + (r / 1e7).toFixed(1).replace(/\.0$/, '') + ' Cr' : r >= 1e5 ? '₹' + (r / 1e5).toFixed(1).replace(/\.0$/, '') + ' L' : r >= 1e3 ? '₹' + (r / 1e3).toFixed(1).replace(/\.0$/, '') + 'k' : '₹' + Math.round(r); };
  const day = s => s ? new Date(s.length === 10 ? s + 'T00:00:00+05:30' : s).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'Asia/Kolkata' }) : '—';
  const dt = s => s ? new Date(s).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit', timeZone: 'Asia/Kolkata' }) : '—';
  const mon = ym => new Date(ym + '-01T00:00:00Z').toLocaleDateString('en-IN', { month: 'short', timeZone: 'UTC' });
  const istToday = () => new Date(Date.now() + 5.5 * 3600e3).toISOString().slice(0, 10);
  const addDays = (iso, n) => new Date(Date.parse(iso + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10);

  // ---------- WhatsApp API (Meta Cloud API) ----------
  // Every call goes to supabase/functions/whatsapp, which keeps the credentials in Vault. This page never receives a token or secret back.
  async function wa(path, method = 'GET', body) {
    const { data } = await sb.auth.getSession(); if (!data.session) throw new Error('Sign in again.');
    const r = await fetch(cfg.supabaseUrl + '/functions/v1/whatsapp' + path, { method, headers: { Authorization: 'Bearer ' + data.session.access_token, apikey: cfg.supabaseKey, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'The request failed (' + r.status + ').'); return j;
  }
  const WA_STATUS = { connected: ['Connected', 'c-good'], saved: ['Saved · not tested', 'c-warn'], error: ['Connection error', 'c-bad'], not_configured: ['Not configured', 'c-mut'], disconnected: ['Disconnected', 'c-mut'] };
  const WA_MSG = { accepted: ['Accepted by Meta', 'c-info'], sent: ['Sent', 'c-info'], delivered: ['Delivered', 'c-good'], read: ['Read', 'c-good'], failed: ['Failed', 'c-bad'], rejected: ['Rejected', 'c-bad'] };
  const WA_TOKEN = { ok: ['Token valid', 'c-good'], expiring: ['Token expiring soon', 'c-warn'], expired: ['Token expired', 'c-bad'], invalid: ['Token invalid', 'c-bad'], none: ['No token saved', 'c-mut'], unknown: ['Token not checked', 'c-mut'] };
  const WA_WEBHOOK = { healthy: 'c-good', waiting: 'c-warn', quiet: 'c-warn', not_verified: 'c-mut', not_subscribed: 'c-warn' };
  const WA_LINKS = [['Meta Developer Apps', 'https://developers.facebook.com/apps/'], ['Meta Business Settings', 'https://business.facebook.com/settings/'], ['Meta Graph API Explorer', 'https://developers.facebook.com/tools/explorer/'], ['WhatsApp Cloud API documentation', 'https://developers.facebook.com/documentation/business-messaging/whatsapp/overview/']];
  const WA_STEPS = [
    ['Open Meta Developer Apps and select the Legal Staff application.', ''],
    ['Open WhatsApp → API Setup.', 'Here you find the App ID (App settings › Basic), the WhatsApp Business Account ID and the Phone Number ID.'],
    ['Use the temporary token for initial testing.', 'It lasts about 24 hours and is not suitable for production.'],
    ['Open Meta Business Settings → Users → System Users.', ''],
    ['Create a System User.', ''],
    ['Assign the Legal Staff WhatsApp Business Account as an asset and grant the required permissions.', 'Give it full control of the WhatsApp account.'],
    ['Generate a System User access token for the Legal Staff application with the required WhatsApp permissions.', 'Select whatsapp_business_messaging and whatsapp_business_management. Choose “Never” for expiry if offered.'],
    ['Copy the token into the secure Legal Staff WhatsApp API configuration page.', 'Paste it only into the masked “System User access token” field below.'],
    ['Save the configuration and test connectivity.', 'Also set the callback URL and verify token under WhatsApp › Configuration in your Meta app, and subscribe to the “messages” field.']];
  const copy = async (t, what) => { try { await navigator.clipboard.writeText(t); toast(what + ' copied'); } catch (e) { toast('Copy failed. Select the text and copy it.'); } };

  VIEWS.whatsapp = async p => {
    let S = await wa('/connection/status'), tpls = null, results = null;
    const chip = (m, k) => { const [t, c] = m[k] || [k || '—', 'c-mut']; return `<span class="chip ${c}">${esc(t)}</span>`; };
    const field = (id, label, o = {}) => `<label class="f">${label}<input id="${id}" type="${o.pw ? 'password' : 'text'}" ${o.pw ? 'autocomplete="new-password" spellcheck="false"' : 'autocomplete="off"'} value="${esc(o.val ?? '')}" placeholder="${esc(o.ph ?? '')}" ${o.attr || ''}>${o.hint ? `<span class="small" style="font-weight:400">${o.hint}</span>` : ''}</label>`;
    const saved = k => S.secrets[k] ? 'Saved and masked. Leave empty to keep it, or paste a new one to replace it.' : 'Not saved yet.';
    const draw = () => {
      const c = S.config, w = S.webhook, tk = S.token, ready = c.status === 'connected';
      p.innerHTML = `
      <div class="small muted" style="margin-bottom:6px"><a href="#settings" data-go="settings">Settings</a> › <a href="#settings/integrations" data-go="settings/integrations">Integrations</a> › WhatsApp API</div>
      <h1>WhatsApp API</h1><p class="sub">Meta WhatsApp Business Platform (Cloud API), connected directly. No Brevo, Twilio, WATI, Interakt or other paid provider.</p>

      <div class="card" id="status"><div class="row between"><div class="row"><div class="strong" style="font-size:16px">Connection</div>${chip(WA_STATUS, c.status)}${S.secrets.access_token ? chip(WA_TOKEN, tk.health.state) : ''}</div>
        <div class="row"><button class="btn" id="refresh" ${S.secrets.access_token && S.secrets.app_secret ? '' : 'disabled'}>Refresh token status</button><button class="btn pri" id="test">Test connection</button><button class="btn danger" id="disc" ${c.status === 'not_configured' ? 'disabled' : ''}>Disconnect</button></div></div>
        ${c.status_detail ? `<p class="small ${c.status === 'error' ? 'err' : 'muted'}" style="margin:10px 0 0">${esc(c.status_detail)}</p>` : ''}
        <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-top:14px">
          <div><div class="small muted">Number</div><div class="strong">${esc(c.display_phone_number || '—')}</div></div>
          <div><div class="small muted">Verified name</div><div class="strong">${esc(c.verified_name || '—')}</div></div>
          <div><div class="small muted">Quality rating</div><div class="strong">${esc(c.quality_rating ? c.quality_rating.toLowerCase() : '—')}</div></div>
          <div><div class="small muted">Token expires</div><div class="strong">${tk.health.permanent ? 'Does not expire' : tk.expires_at ? esc(day(tk.expires_at)) + (tk.health.daysLeft != null ? ` (${tk.health.daysLeft} d)` : '') : '—'}</div></div>
          <div><div class="small muted">Last checked</div><div class="strong">${esc(dt(c.last_checked_at))}</div></div></div>
        ${tk.scopes.length ? `<div class="small muted" style="margin-top:10px">Token permissions: ${tk.scopes.filter(x => S.required_scopes.includes(x)).map(x => `<code>${esc(x)}</code>`).join(', ') || 'none of the required ones'}</div>` : ''}
        ${S.legacy_number_in_use ? `<p class="small muted" style="margin:10px 0 0">The WhatsApp number already set through server settings keeps sending the daily briefings. Nothing here replaces or disconnects it.</p>` : ''}
        <div id="results">${results ? renderResults(results) : ''}</div></div>

      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(380px,1fr));margin-top:14px;align-items:start">
        <div class="card grid" style="gap:12px" id="cred"><div class="strong" style="font-size:16px">Credentials</div>
          <div class="two">${field('app_id', 'Meta App ID', { val: c.app_id, ph: '1234567890123456' })}${field('app_secret', 'Meta App Secret', { pw: 1, ph: S.secrets.app_secret ? '••••••••••••••••' : '', hint: saved('app_secret') })}</div>
          <div class="two">${field('waba_id', 'WhatsApp Business Account ID (WABA ID)', { val: c.waba_id })}${field('phone_number_id', 'Phone Number ID', { val: c.phone_number_id, hint: 'The ID from API Setup, not the phone number.' })}</div>
          ${field('access_token', 'System User access token', { pw: 1, ph: S.secrets.access_token ? '••••••••••••••••••••••••' : '', hint: saved('access_token') + (tk.replaced_at ? ` Last replaced ${esc(dt(tk.replaced_at))}.` : '') })}
          <div>${field('verify_token', 'Webhook verify token', { pw: 1, ph: S.secrets.verify_token ? '••••••••••••' : '', hint: saved('verify_token') })}<div class="row" style="margin-top:6px"><button class="btn sm" type="button" id="gen">Generate a token</button><button class="btn sm" type="button" id="showv" style="display:none">Show</button><span class="small muted">Use the same value in your Meta app's webhook settings.</span></div></div>
          ${field('graph_version', 'Graph API version', { val: c.graph_version, ph: 'v21.0', attr: 'style="max-width:140px"' })}
          <div class="row between"><span class="err" id="cer"></span><button class="btn pri" id="save">Save configuration</button></div></div>

        <div class="card grid" style="gap:10px" id="hook"><div class="strong" style="font-size:16px">Webhook</div>
          <label class="f">Callback URL<div class="row" style="flex-wrap:nowrap"><input readonly value="${esc(w.callback_url)}" id="cb"><button class="btn" id="cpcb" type="button">Copy</button></div></label>
          <div class="row small"><span class="muted">Verification</span>${w.verified_at ? `<span class="chip c-good">Verified ${esc(dt(w.verified_at))}</span>` : `<span class="chip c-mut">Not verified yet</span>`}</div>
          <div class="row small"><span class="muted">Health</span><span class="chip ${WA_WEBHOOK[w.health.state] || 'c-mut'}">${esc(w.health.label)}</span></div>
          <div class="row small"><span class="muted">Subscribed fields</span>${w.fields.length ? w.fields.map(f => `<code>${esc(f)}</code>`).join(' ') : '<span class="muted">not read yet (run Test connection)</span>'}</div>
          <div class="small muted">Needed: ${w.required_fields.slice(0, 1).map(f => `<code>${f}</code>`).join('')} (message status). Optional: ${w.required_fields.slice(1).map(f => `<code>${f}</code>`).join(' ')}.</div>
          <div class="row small"><span class="muted">Last event</span><span>${w.last_event_at ? esc(dt(w.last_event_at)) + ' · ' + esc(w.last_event) : 'none yet'}</span></div>
          <p class="small muted" style="margin:0">Meta's calls are accepted only with a valid <code>X-Hub-Signature-256</code>. Delivery, read and failure statuses update sent messages. Ordinary incoming messages are not stored and there is no inbox. A STOP reply opts that number out.</p>
          <div class="row"><button class="btn" id="sub" ${ready ? '' : 'disabled'}>Subscribe webhook</button><span class="small muted">Subscribes this app to the WhatsApp Business Account.</span></div></div>
      </div>

      <div class="card grid" style="margin-top:14px;gap:12px" id="sendbox"><div class="row between"><div class="strong" style="font-size:16px">Send a test message</div><button class="btn sm" id="ltpl" ${ready ? '' : 'disabled'}>${tpls ? 'Reload templates' : 'Load approved templates'}</button></div>
        ${ready ? '' : '<div class="small muted">Run “Test connection” successfully first.</div>'}
        <div class="two">${field('t_to', 'Recipient number', { ph: '919876543210', hint: 'With country code. A 10-digit number is taken as +91.' })}
          <label class="f">Approved template<select id="t_tpl" ${tpls && tpls.length ? '' : 'disabled'}>${tpls ? (tpls.length ? tpls.map((t, i) => `<option value="${i}">${esc(t.name)} · ${esc(t.language)}</option>`).join('') : '<option>No approved templates</option>') : '<option>Load the templates first</option>'}</select></label></div>
        <div class="two">${field('t_lang', 'Template language', { ph: 'en', hint: 'Filled from the template. Must match exactly.' })}<div id="t_prev" class="small muted" style="align-self:end"></div></div>
        <div id="t_vars" class="grid" style="gap:8px"></div>
        <div class="row between"><span class="small muted">Up to 10 test messages per hour. Meta may charge for template conversations.</span><button class="btn pri" id="send" ${ready ? '' : 'disabled'}>Send test message</button></div>
        <div id="t_out"></div></div>

      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(380px,1fr));margin-top:14px;align-items:start">
        <div class="card" id="help"><div class="strong" style="font-size:16px">Help &amp; setup · get your System User token</div>
          <div class="row small" style="margin:10px 0">${WA_LINKS.map(([t, u]) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${esc(t)} ↗</a>`).join(' · ')}</div>
          <ol style="margin:0;padding-left:20px;display:grid;gap:8px">${WA_STEPS.map(([t, n], i) => `<li><b>Step ${i + 1}:</b> ${esc(t)}${n ? `<div class="small muted">${esc(n)}</div>` : ''}</li>`).join('')}</ol>
          <div class="small" style="margin-top:12px;padding:10px 12px;background:var(--warnbg);color:var(--warn);border-radius:8px">Never paste tokens into chat, email, tickets or public documents. Paste them only into the masked fields on this page. If a token was shared by mistake, revoke it in Meta Business Settings and create a new one.</div></div>
        <div class="card" id="sec"><div class="strong" style="font-size:16px">Security</div>
          <ul class="small" style="margin:10px 0 0;padding-left:18px;display:grid;gap:6px">
            <li>Credentials are stored server-side in an encrypted vault and are never sent back to this page.</li>
            <li>Only Legal Staff administrators can open or change this page. Every change and test is written to an audit log.</li>
            <li>Meta's webhooks are verified with your App Secret before anything is stored.</li>
            <li>To rotate a credential, paste the new value and save. The old one is overwritten. Then run Test connection.</li>
            <li>Disconnect removes the credentials from Legal Staff only. It does not change, delete or move your number at Meta.</li>
            <li>Required Meta permissions: ${S.required_scopes.map(x => `<code>${x}</code>`).join(', ')}.</li></ul></div>
      </div>

      <div class="card" style="margin-top:14px"><div class="strong" style="font-size:16px">Messages sent through the Cloud API</div>
        <div class="tscroll"><table><thead><tr><th>When</th><th>To</th><th>Template</th><th>Status</th><th>Meta message ID</th></tr></thead><tbody>${S.messages.length ? S.messages.map(m => `<tr><td>${esc(dt(m.created_at))}</td><td>${esc(m.to_masked)}</td><td>${esc(m.template)} <span class="muted small">${esc(m.kind)}</span></td><td>${chip(WA_MSG, m.status)}${m.error_message ? `<div class="small err">${esc(m.error_message)}</div>` : ''}</td><td class="small mono">${esc(m.wamid || '—')}</td></tr>`).join('') : '<tr><td colspan="5" class="empty">None yet.</td></tr>'}</tbody></table></div>
        <div class="small muted">“Accepted by Meta” only means the API took the request. A message counts as delivered only after Meta's delivery webhook says so.</div></div>

      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(380px,1fr));margin-top:14px;align-items:start">
        <div class="card"><div class="strong" style="font-size:16px">API error history</div>
          <div class="tscroll"><table><thead><tr><th>When</th><th>Call</th><th>Error</th></tr></thead><tbody>${S.errors.length ? S.errors.map(e => `<tr><td>${esc(dt(e.at))}</td><td class="small">${esc(e.action)}<div class="muted">${e.http_status || 'network'}${e.code ? ' · code ' + e.code : ''}</div></td><td class="small">${esc(e.message)}${e.fbtrace_id ? `<div class="muted mono">trace ${esc(e.fbtrace_id)}</div>` : ''}</td></tr>`).join('') : '<tr><td colspan="3" class="empty">No errors.</td></tr>'}</tbody></table></div></div>
        <div class="card"><div class="strong" style="font-size:16px">Audit log</div>
          <div class="tscroll"><table><thead><tr><th>When</th><th>Who</th><th>Action</th></tr></thead><tbody>${S.audit.length ? S.audit.map(a => `<tr><td>${esc(dt(a.at))}</td><td class="small">${esc(a.actor)}</td><td class="small">${esc(a.action.replace(/_/g, ' '))}${a.detail && a.detail.changed && a.detail.changed.length ? `<div class="muted">${esc(a.detail.changed.join(', '))}</div>` : ''}</td></tr>`).join('') : '<tr><td colspan="3" class="empty">Nothing yet.</td></tr>'}</tbody></table></div></div>
      </div>`;
      wire();
    };
    const renderResults = r => `<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px">${r.checks.map(c => `<div class="row" style="align-items:flex-start;flex-wrap:nowrap"><span class="chip ${c.level === 'ok' ? 'c-good' : c.level === 'warn' ? 'c-warn' : c.level === 'skipped' ? 'c-mut' : 'c-bad'}" style="min-width:64px;text-align:center">${c.level === 'ok' ? 'Passed' : c.level === 'warn' ? 'Check' : c.level === 'skipped' ? 'Skipped' : 'Failed'}</span><div><div class="strong">${esc(c.label)}</div><div class="small muted">${esc(c.detail)}</div></div></div>`).join('')}</div>`;
    const busy = (b, on, label) => { b.disabled = on; if (label) b.dataset.l = b.dataset.l || b.textContent; b.textContent = on ? label : (b.dataset.l || b.textContent); };
    const wire = () => {
      p.querySelectorAll('[data-go]').forEach(a => a.onclick = e => { e.preventDefault(); go(a.dataset.go); });
      const $ = id => p.querySelector('#' + id);
      $('cpcb').onclick = () => copy($('cb').value, 'Callback URL');
      $('gen').onclick = () => { const b = new Uint8Array(24); crypto.getRandomValues(b); const f = $('verify_token'); f.value = [...b].map(x => x.toString(16).padStart(2, '0')).join(''); f.type = 'text'; $('showv').style.display = ''; $('showv').textContent = 'Hide'; toast('Copy it into Meta now, then Save. It is masked after saving.'); };
      $('showv').onclick = () => { const f = $('verify_token'); f.type = f.type === 'text' ? 'password' : 'text'; $('showv').textContent = f.type === 'text' ? 'Hide' : 'Show'; };
      $('save').onclick = async e => { const b = e.target; $('cer').textContent = ''; const body = {}; ['app_id', 'waba_id', 'phone_number_id', 'graph_version'].forEach(k => { body[k] = $(k).value.trim(); });
        ['app_secret', 'access_token', 'verify_token'].forEach(k => { const v = $(k).value.trim(); if (v) body[k] = v; });
        busy(b, true, 'Saving…'); try { const r = await wa('/connection/save', 'POST', body); S = r.status; results = null; toast(r.changed.length ? 'Configuration saved. Now run Test connection.' : 'Nothing changed'); draw(); } catch (er) { $('cer').textContent = er.message; busy(b, false); } };
      $('test').onclick = async e => { const b = e.target; busy(b, true, 'Testing with Meta…'); try { const r = await wa('/connection/test', 'POST'); results = r; S = r.status_view; draw(); toast(r.ok ? 'Connected to Meta' : 'Connection test found problems'); } catch (er) { busy(b, false); toast(er.message); } };
      $('refresh').onclick = async e => { const b = e.target; busy(b, true, 'Checking…'); try { const r = await wa('/connection/refresh-token', 'POST'); S = r.status; draw(); toast('Token status updated'); } catch (er) { busy(b, false); toast(er.message); } };
      $('disc').onclick = () => modal(`<h2>Disconnect WhatsApp API?</h2><p class="muted" style="margin:0">This deletes the stored App Secret, access token and verify token from Legal Staff. Your WhatsApp Business number and account at Meta are not changed, and the number already used for daily briefings keeps working.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-x>Cancel</button><button class="btn danger" data-ok>Disconnect</button></div>`, (m, close) => { m.querySelector('[data-x]').onclick = close; m.querySelector('[data-ok]').onclick = async () => { try { const r = await wa('/connection/disconnect', 'POST', { confirm: true }); S = r.status; results = null; close(); draw(); toast('Disconnected'); } catch (er) { close(); toast(er.message); } }; });
      $('sub').onclick = () => modal(`<h2>Subscribe webhook</h2><p class="muted" style="margin:0">Subscribes this Meta app to your WhatsApp Business Account so status events can be delivered. The callback URL itself is set in your Meta app (WhatsApp › Configuration).</p><label class="row small" style="gap:8px;align-items:flex-start"><input type="checkbox" id="ov" style="width:auto;height:auto;margin-top:3px">Also override this account's callback URL with the one above. Only tick this if nothing else uses this account's webhooks: it redirects them.</label><div class="row" style="justify-content:flex-end"><button class="btn" data-x>Cancel</button><button class="btn pri" data-ok>Subscribe</button></div>`, (m, close) => { m.querySelector('[data-x]').onclick = close; m.querySelector('[data-ok]').onclick = async () => { try { const r = await wa('/webhook/subscribe', 'POST', { confirm: true, override_callback: m.querySelector('#ov').checked }); S = r.status; close(); draw(); toast('Subscribed'); } catch (er) { close(); toast(er.message); } }; });
      const pick = () => { const t = tpls && tpls[+$('t_tpl').value]; if (!t) return; $('t_lang').value = t.language; $('t_prev').textContent = t.body; $('t_vars').innerHTML = Array.from({ length: t.variables }, (_, i) => `<label class="f">Variable {{${i + 1}}}<input data-v="${i}" autocomplete="off"></label>`).join(''); };
      $('ltpl').onclick = async e => { const b = e.target; busy(b, true, 'Loading…'); try { tpls = (await wa('/templates')).templates; draw(); pick(); } catch (er) { busy(b, false); toast(er.message); } };
      if (tpls && tpls.length) { $('t_tpl').onchange = pick; pick(); }
      $('send').onclick = async e => { const b = e.target, out = $('t_out'); const t = tpls && tpls[+$('t_tpl').value]; out.innerHTML = '';
        if (!t) { out.innerHTML = '<div class="err">Load the approved templates and choose one.</div>'; return; }
        busy(b, true, 'Sending…');
        try { const r = await wa('/send-test', 'POST', { to: $('t_to').value, template: t.name, language: $('t_lang').value.trim(), variables: [...p.querySelectorAll('[data-v]')].map(i => i.value) });
          out.innerHTML = r.accepted ? `<div class="small" style="padding:12px;background:var(--infobg);border-radius:8px;display:grid;gap:4px"><div><span class="chip c-info">Accepted by Meta</span> <span class="muted">Not yet delivered.</span></div><div>Meta message ID: <span class="mono">${esc(r.meta_message_id)}</span></div><div class="muted">${esc(r.request.endpoint)} · ${esc(r.request.to)} · ${esc(r.request.template)} (${esc(r.request.language)})</div><div class="muted">${esc(r.note)}</div></div>`
            : `<div class="small" style="padding:12px;background:var(--badbg);border-radius:8px;display:grid;gap:4px"><div><span class="chip c-bad">Rejected by Meta</span></div><div>${esc(r.error.message)}</div><div class="muted">Code ${esc(r.error.code)}${r.error.subcode ? '/' + esc(r.error.subcode) : ''} · type ${esc(r.error.kind)}${r.error.fbtrace_id ? ' · trace ' + esc(r.error.fbtrace_id) : ''}</div></div>`;
          S = await wa('/connection/status');
        } catch (er) { out.innerHTML = `<div class="err">${esc(er.message)}</div>`; }
        busy(b, false); };
    };
    draw();
  };

  // extensions (admin-email.js adds the Email Marketing tab); hash links such as #email/contacts move inside a tab
  window.addEventListener('hashchange', () => { const k = location.hash.slice(1); if (me && k) go(k); });
  (window.LSAdminExtensions || []).forEach(f => f({ sb, esc, dt, day, toast, modal, VIEWS, TABS, fnUrl: name => cfg.supabaseUrl.replace(/\/$/, '') + '/functions/v1/' + name }));
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') loginView(); });
  boot();
})();
</script>
</body>
</html>
